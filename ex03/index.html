<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colors and Opacity</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Color Systems</h1>
    <div class="palette">
        <div class="swatch named">Named: tomato</div>
        <div class="swatch hex">HEX: #3498db</div>
        <div class="swatch rgb-color">RGB: rgb(46, 204, 113)</div>
        <div class="swatch rgba-color">RGBA: rgba(155, 89, 182, 0.6)</div>
    </div>
    <hr color="blue">

    <h1>Opacity vs RGBA</h1>

    <div class="comparison">
        <div class="box-opacity">
            <p>Text with opacity 0.5</p>
        </div>
        
        <div class="box-rgba">
            <p>Text with RGBA background</p>
        </div>
    </div>
</body>
</html>
